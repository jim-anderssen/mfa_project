[project]
name = "mfa-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.1.1",
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.28",
    "eurostat>=1.0",
    "streamlit>=1.30",
    "folium>=0.15",
    "streamlit-folium>=0.18",
    "openpyxl>=3.1.5",
    "pymrio>=0.4.8",
]

[dependency-groups]
dev = [
    "ipykernel>=7.0.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

